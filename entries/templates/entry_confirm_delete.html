{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <h3>Подтвердите удаление</h3>
  <p>Вы действительно хотите удалить запись "{{ object.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next|default:'/' }}"/>
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="#" onclick="history.back();" class="btn btn-secondary">Нет, вернуться назад</a>
  </form>
</div>
{% endblock %}
