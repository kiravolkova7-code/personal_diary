<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Личный дневник | {% block title %}{% endblock %}</title>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Мой дневник</a>

      {% if request.user.is_authenticated %}
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <span class="nav-link disabled">Привет, {{ request.user.username }}</span>
          </li>
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Выход</button>
            </form>
          </li>
        </ul>
      {% else %}
        <ul class="navbar-nav ms-auto">
          <li><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
          <li><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
        </ul>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
