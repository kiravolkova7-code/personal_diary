<!DOCTYPE html>
<html lang="ru">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный дневник | {% block title %}{% endblock %}</title>

  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="border-bottom bg-body-tertiary py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3 text-decoration-none logo-link">
        <a href="/" class="text-reset d-flex align-items-center">
          <img
            src="{% static 'images/diary.png' %}"
            alt="Мой личный дневник"
            width="67" height="auto"
          >
          <span class="h5 mb-0 fw-bold">Мой дневник</span>
        </a>
      </div>

      <nav>
        {% if request.user.is_authenticated %}
          <span class="me-3 text-muted small align-middle">Привет, {{ request.user.first_name }}</span>
          <form method="post" action="{% url 'users:logout' %}" class="d-inline-block">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
          </form>
        {% else %}
          <a href="{% url 'users:login' %}" class="text-decoration-none link-primary me-2">Войти</a><span class="text-muted">•</span>
          <a href="{% url 'users:register' %}" class="text-decoration-none link-primary ms-2">Регистрация</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const logoutBtn = document.querySelector('#logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(event) {
                event.preventDefault();

                localStorage.removeItem('access');
                localStorage.removeItem('refresh');

                this.closest('form').submit();
            });
        }
    });
  </script>
</body>
</html>
